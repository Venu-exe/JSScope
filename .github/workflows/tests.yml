name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # Pin the runner: ubuntu-latest (26.04) no longer provides Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Smoke test CLI
        run: |
          python jsscope.py --version
          python jsscope.py --no-banner -f jsscope.py
