name: publish-pypi

# Publishes to PyPI using Trusted Publishing (OIDC) - no API token needed.
#
# One-time setup:
#   1. Create the project "jsscope" as a pending trusted publisher at
#      https://pypi.org/manage/account/publishing/
#      Owner: Venu-exe  Repository: JSScope  Workflow: publish-pypi.yml
#      Environment: pypi
#   2. Add the repository variable PUBLISH_TO_PYPI = true
#      (Settings -> Secrets and variables -> Actions -> Variables)
#
# Until that is done this workflow is skipped, so releases stay green.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jsscope
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
